# What odin-pango is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-pango"
license = "LGPL-2.1-or-later"
kind = "binding"
summary = "Odin bindings for Pango and PangoCairo, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "linux",
  "odin",
  "pango",
  "runic",
]
collection = "pango"
steps = [
  "init-modules",
  "check-no-agent-files",
  "lint",
  "check",
  "test",
  "check-bitfields",
]

[siblings.AMBER_ROOT]
odin-glib = "https://github.com/Hyperquader-Coders/odin-glib"
odin-cairo = "https://github.com/Hyperquader-Coders/odin-cairo"

[build]
packages = [
  "libpango1.0-dev",
]
lib = [
  "pango",
  "pangocairo",
]

[test]
packages = [
  "gcc",
  "pkg-config",
  "shellcheck",
  "shfmt",
]
